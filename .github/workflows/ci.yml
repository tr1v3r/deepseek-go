name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.22.x', stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Enable Mach-O UUID for Go 1.22 on modern macOS
        if: runner.os == 'macOS' && matrix.go == '1.22.x'
        shell: bash
        # Go 1.22 needs this opt-in; newer macOS dyld rejects binaries without LC_UUID.
        # https://go.dev/issue/68678
        run: echo 'GOFLAGS=-ldflags=-B=gobuildid' >> "$GITHUB_ENV"
      - run: go vet ./...
      - run: go test -race -cover ./...
      - run: go build ./examples/...
  format-and-fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Fuzz SSE decoder
        run: go test ./internal/sse -fuzz=FuzzDecoder -fuzztime=15s
